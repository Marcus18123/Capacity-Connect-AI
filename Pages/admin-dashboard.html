<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Capacity Connect AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-text">Capacity Connect AI</div>
      </div>
      
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item active">
          <span class="nav-icon">🛡️</span> Admin Console
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-item logout-btn" style="padding: var(--spacing-xs) 0;">
          <span class="nav-icon">🚪</span> Logout
        </a>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <h1 class="page-title">Admin Management Console</h1>
        </div>
        
        <div class="topbar-right">
          <div class="user-profile">
            <div class="user-info" style="text-align: right;">
              <span class="user-name" id="topbar-user-name">Admin User</span>
              <span class="user-role" id="topbar-user-role">Administrator</span>
            </div>
            <div class="avatar" id="topbar-user-avatar">AD</div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        
        <!-- Metrics -->
        <div class="grid-kpi mb-xl">
          <div class="card">
            <div class="kpi-label">Active Trainees</div>
            <div class="kpi-value text-primary" id="admin-kpi-trainees">0</div>
          </div>
          <div class="card">
            <div class="kpi-label">Approved Trainers</div>
            <div class="kpi-value text-success" id="admin-kpi-trainers">0</div>
          </div>
          <div class="card">
            <div class="kpi-label">Pending Approval</div>
            <div class="kpi-value text-warning" id="admin-kpi-pending">0</div>
          </div>
        </div>

        <!-- Pending Trainer Approvals Table -->
        <div class="card">
          <div class="card-header mb-md">
            <h3 class="card-title">Pending Trainer Applications</h3>
          </div>

          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
              <tr style="border-bottom: 2px solid var(--border-default); color: var(--color-neutral-muted); font-size: var(--text-xs);">
                <th style="padding: var(--spacing-sm);">NAME</th>
                <th style="padding: var(--spacing-sm);">EMAIL</th>
                <th style="padding: var(--spacing-sm);">STATUS</th>
                <th style="padding: var(--spacing-sm);">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="pending-trainers-table">
              <!-- Injected via JS -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
